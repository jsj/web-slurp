name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type checks and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and system libraries
        run: bun node_modules/agent-browser/bin/agent-browser.js install --with-deps
      - name: Check Chrome
        run: google-chrome --version
      - name: Check types
        run: bun run check
      - name: Run browser tests
        run: xvfb-run -a bun test
      - name: Check automatic runtime setup
        run: sh test/bootstrap.sh
      - name: Check package contents
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP/web-slurp-0.3.0.tgz" > "$RUNNER_TEMP/package-files.txt"
          grep -Fx 'package/LICENSE' "$RUNNER_TEMP/package-files.txt"
          grep -Fx 'package/SKILL.md' "$RUNNER_TEMP/package-files.txt"
          grep -Fx 'package/dependencies.lock' "$RUNNER_TEMP/package-files.txt"
